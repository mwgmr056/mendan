<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>面談予約</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #1f2933; --muted: #6b7785;
    --line: #dde2e8; --accent: #1f6feb; --accent-soft: #e7f0ff; --ok: #1a7f4b; --err: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171b; --card: #1d2228; --text: #e6e9ed; --muted: #9aa5b1;
            --line: #2f3740; --accent: #5b9dff; --accent-soft: #1f2d44; --ok: #4cc38a; --err: #ff7b72; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif; line-height: 1.6; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  h2 { font-size: 1rem; margin: 0 0 8px; }
  .lead { color: var(--muted); margin: 0 0 20px; font-size: .95rem; white-space: pre-wrap; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 8px; }
  .toolbar h2 { margin: 0; }
  .day { margin-top: 14px; }
  .day:first-child { margin-top: 4px; }
  .day h3 { font-size: .9rem; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
  .slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .slot { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 8px;
          padding: 10px; text-align: left; cursor: pointer; font: inherit; }
  .slot:hover { border-color: var(--accent); }
  .slot[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); outline: 2px solid var(--accent); }
  .slot .t { font-weight: 600; display: block; }
  .slot .n { font-size: .8rem; color: var(--muted); }
  label { display: block; font-size: .9rem; margin: 12px 0 4px; }
  input { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 8px;
          background: var(--bg); color: var(--text); font: inherit; }
  .chosen { background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; font-weight: 600; margin: 0 0 8px; }
  button { font: inherit; cursor: pointer; }
  .primary { margin-top: 16px; width: 100%; padding: 12px; border: 0; border-radius: 8px;
             background: var(--accent); color: #fff; font-weight: 600; }
  .secondary { padding: 10px 14px; border: 1px solid var(--accent); border-radius: 8px; background: transparent; color: var(--accent); font-weight: 600; }
  .danger { padding: 10px 14px; border: 1px solid var(--err); border-radius: 8px; background: transparent; color: var(--err); font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .link { background: none; border: 0; color: var(--accent); padding: 4px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .msg { padding: 10px 12px; border-radius: 8px; margin-bottom: 16px; font-size: .95rem; color: var(--err); border: 1px solid var(--err); }
  .muted { color: var(--muted); }
  .small { font-size: .85rem; }
  .done h2 { color: var(--ok); }
  details summary { cursor: pointer; font-weight: 600; }
  .inline { display: flex; gap: 8px; margin-top: 8px; }
  .inline input { flex: 1; }
  a { color: var(--accent); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1 id="title">面談予約</h1>
  <p class="lead" id="desc">ご希望の枠を選び、氏名とメールアドレスを入力してください。先着順で、埋まった枠は一覧から消えます。</p>

  <div id="message" class="msg" hidden></div>

  <!-- 予約済みの人（変更用リンクから来た場合） -->
  <section id="manage" class="card" hidden>
    <h2>現在のご予約</h2>
    <p class="chosen" id="curSlot"></p>
    <p class="muted small" id="curWho"></p>
    <div class="row" id="manageBtns">
      <button class="secondary" id="btnChange" type="button">別の枠に変更する</button>
      <button class="danger" id="btnCancel" type="button">予約を取り消す</button>
    </div>
    <p class="muted small" id="lockedNote" hidden>面談の開始時刻を過ぎたため、変更・取り消しはできません。</p>
  </section>

  <!-- 枠の一覧 -->
  <section id="pick" hidden>
    <div class="card">
      <div class="toolbar">
        <h2 id="pickTitle">空いている枠</h2>
        <button class="link" id="reload" type="button">↻ 更新</button>
      </div>
      <div id="list"><p class="muted">読み込み中…</p></div>
    </div>

    <form class="card" id="form" hidden novalidate>
      <p class="chosen" id="chosen"></p>
      <label for="name">氏名</label>
      <input id="name" autocomplete="name" maxlength="50" required>
      <label for="email">メールアドレス</label>
      <input id="email" type="email" autocomplete="email" maxlength="120" required>
      <label for="email2">メールアドレス（確認）</label>
      <input id="email2" type="email" autocomplete="off" maxlength="120" required>
      <button class="primary" id="submit" type="submit">この枠で予約する</button>
    </form>

    <div class="card" id="changeBox" hidden>
      <h2>変更後の枠</h2>
      <p class="chosen" id="changeTo"></p>
      <button class="primary" id="btnDoChange" type="button">この枠に変更する</button>
      <div style="text-align:center;margin-top:8px"><button class="link" id="btnBack" type="button">変更をやめる</button></div>
    </div>
  </section>

  <!-- 完了 -->
  <section id="done" class="card done" hidden>
    <h2 id="doneTitle"></h2>
    <p class="chosen" id="doneSlot"></p>
    <p id="doneMsg"></p>
    <p id="doneLink" class="small"></p>
  </section>

  <!-- 変更用リンクの再送 -->
  <details class="card" id="resendBox" hidden>
    <summary>すでに予約した方（日時の変更・取り消し）</summary>
    <p class="muted small">予約時にお送りしたメールのリンクから変更・取り消しができます。メールが見当たらない場合は、登録したメールアドレスを入力するとリンクを再送します。</p>
    <form class="inline" id="resendForm" novalidate>
      <input id="resendEmail" type="email" placeholder="登録したメールアドレス" autocomplete="email">
      <button class="secondary" id="resendBtn" type="submit">再送</button>
    </form>
    <p class="small" id="resendMsg"></p>
  </details>
</main>

<script src="config.js"></script>
<script src="demo.js"></script>
<script>
const API = window.API_URL || '';
const token = new URLSearchParams(location.search).get('t');
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WD = '日月火水木金土';
function fmtDate(d) { const [y, m, dd] = d.split('-').map(Number); return `${y}年${m}月${dd}日（${WD[new Date(y, m - 1, dd).getDay()]}）`; }
function fmtSlot(s) { return `${fmtDate(s.date)} ${s.start}〜${s.end}${s.note ? '　' + s.note : ''}`; }
const bookUrl = location.pathname;

let slots = [], selected = null, mode = 'book', booking = null;

async function api(action, p = {}) {
  const body = Object.assign({ action }, p);
  if (API === 'demo') return window.DEMO.post(body);
  const res = await fetch(API, { method: 'POST', body: JSON.stringify(body) });
  return res.json();
}

function showError(text) {
  const m = $('message'); m.textContent = text || ''; m.hidden = !text;
  if (text) m.scrollIntoView({ block: 'center', behavior: 'smooth' });
}
function show(ids) { ['manage', 'pick', 'done', 'resendBox'].forEach(id => $(id).hidden = !ids.includes(id)); }
function applyHeader(d) {
  if (d.title) { $('title').textContent = d.title; document.title = d.title; }
  if (d.description) $('desc').textContent = d.description;
}

/* ---------- 枠一覧 ---------- */
function renderList() {
  if (selected && !slots.some(s => s.id === selected.id)) selectSlot(null);
  if (!slots.length) { $('list').innerHTML = '<p class="muted">現在、空いている枠はありません。</p>'; return; }
  const byDay = {};
  slots.forEach(s => (byDay[s.date] = byDay[s.date] || []).push(s));
  $('list').innerHTML = Object.keys(byDay).map(day => `
    <div class="day"><h3>${esc(fmtDate(day))}</h3><div class="slots">
      ${byDay[day].map(s => `<button type="button" class="slot" data-id="${esc(s.id)}" aria-pressed="${!!selected && selected.id === s.id}">
        <span class="t">${esc(s.start)}〜${esc(s.end)}</span>${s.note ? `<span class="n">${esc(s.note)}</span>` : ''}
      </button>`).join('')}
    </div></div>`).join('');
}
$('list').addEventListener('click', e => {
  const b = e.target.closest('.slot'); if (!b) return;
  selectSlot(slots.find(s => s.id === b.dataset.id));
});

function selectSlot(slot) {
  selected = slot || null;
  document.querySelectorAll('.slot').forEach(b => b.setAttribute('aria-pressed', String(!!slot && b.dataset.id === slot.id)));
  $('form').hidden = !(slot && mode === 'book');
  $('changeBox').hidden = !(slot && mode === 'change');
  if (!slot) return;
  if (mode === 'book') {
    $('chosen').textContent = fmtSlot(slot);
    $('form').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    $('name').focus({ preventScroll: true });
  } else {
    $('changeTo').textContent = fmtSlot(slot);
    $('changeBox').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
}

async function reloadSlots() {
  showError('');
  $('list').innerHTML = '<p class="muted">読み込み中…</p>';
  try {
    const d = token ? await api('mine', { token }) : await api('slots');
    if (!d.ok) { showError(d.message); return; }
    slots = d.slots; renderList();
  } catch (_) { $('list').innerHTML = '<p class="muted">一覧を取得できませんでした。「更新」を押してください。</p>'; }
}
$('reload').addEventListener('click', reloadSlots);

/* ---------- 新規予約 ---------- */
$('form').addEventListener('submit', async e => {
  e.preventDefault(); showError('');
  const name = $('name').value.trim(), email = $('email').value.trim(), email2 = $('email2').value.trim();
  if (!selected) return showError('枠を選んでください。');
  if (!name) return showError('氏名を入力してください。');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showError('メールアドレスの形式を確認してください。');
  if (email.toLowerCase() !== email2.toLowerCase()) return showError('確認用のメールアドレスが一致しません。');

  busy($('submit'), true, '送信中…');
  try {
    const d = await api('book', { id: selected.id, name, email });
    if (d.ok) {
      finish('予約を受け付けました', d.slot, d.mailed
        ? `${email} 宛に確認メールを送信しました。日時の変更・取り消しは、メール内のリンクから行えます。`
        : '予約は確定しましたが、確認メールの送信に失敗しました。この画面を控えておいてください。',
        `<a href="?t=${encodeURIComponent(d.token)}">この画面から変更・取り消しをする</a>`);
    } else {
      showError(d.message || '予約できませんでした。');
      if (d.error === 'taken' || d.error === 'not_found') { selectSlot(null); reloadSlots(); }
      if (d.error === 'duplicate') { $('resendBox').open = true; $('resendEmail').value = email; }
    }
  } catch (_) {
    showError('通信に失敗しました。予約できたか不明な場合は、メールが届いているかご確認ください。');
  } finally { busy($('submit'), false, 'この枠で予約する'); }
});

/* ---------- 予約の確認・変更・取り消し ---------- */
async function loadManage() {
  mode = 'view';
  show([]);
  try {
    const d = await api('mine', { token });
    if (!d.ok) {
      showError(d.message + ' 新しく予約する場合は下のボタンから。');
      $('done').hidden = false; $('doneTitle').textContent = ''; $('doneSlot').hidden = true;
      $('doneMsg').innerHTML = `<a href="${esc(bookUrl)}">予約ページを開く</a>`;
      return;
    }
    applyHeader(d);
    booking = d.booking; slots = d.slots;
    $('curSlot').textContent = fmtSlot(booking);
    $('curWho').textContent = `${booking.name} 様（${booking.email}）`;
    $('manageBtns').hidden = !d.canChange;
    $('lockedNote').hidden = d.canChange;
    show(['manage']);
  } catch (_) { showError('予約情報を取得できませんでした。時間をおいて再度開いてください。'); }
}

$('btnChange').addEventListener('click', () => {
  mode = 'change'; selected = null;
  $('pickTitle').textContent = '変更先の枠を選んでください';
  renderList();
  show(['manage', 'pick']);
  $('pick').scrollIntoView({ behavior: 'smooth' });
});
$('btnBack').addEventListener('click', () => { mode = 'view'; selectSlot(null); show(['manage']); });

$('btnDoChange').addEventListener('click', async () => {
  if (!selected) return;
  showError('');
  busy($('btnDoChange'), true, '変更中…');
  try {
    const d = await api('change', { token, id: selected.id });
    if (d.ok) {
      finish('予約を変更しました', d.slot, (d.mailed ? '変更内容をメールでお送りしました。' : '変更は完了しましたが、メールの送信に失敗しました。この画面を控えておいてください。')
        + `（変更前：${fmtSlot(d.old)}）`, `<a href="?t=${encodeURIComponent(token)}">さらに変更・取り消しをする</a>`);
    } else {
      showError(d.message);
      if (d.error === 'taken' || d.error === 'not_found') { selectSlot(null); reloadSlots(); }
    }
  } catch (_) { showError('通信に失敗しました。ページを開き直して、現在の予約をご確認ください。'); }
  finally { busy($('btnDoChange'), false, 'この枠に変更する'); }
});

$('btnCancel').addEventListener('click', async () => {
  if (!confirm(`${fmtSlot(booking)} の予約を取り消します。よろしいですか？`)) return;
  showError('');
  busy($('btnCancel'), true, '処理中…');
  try {
    const d = await api('cancel', { token });
    if (d.ok) {
      finish('予約を取り消しました', d.slot, d.mailed ? '取り消しのお知らせをメールでお送りしました。' : '取り消しは完了しました。',
        `<a href="${esc(bookUrl)}">改めて予約する</a>`);
    } else showError(d.message);
  } catch (_) { showError('通信に失敗しました。ページを開き直して、現在の予約をご確認ください。'); }
  finally { busy($('btnCancel'), false, '予約を取り消す'); }
});

/* ---------- リンク再送 ---------- */
$('resendForm').addEventListener('submit', async e => {
  e.preventDefault();
  const email = $('resendEmail').value.trim();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { $('resendMsg').textContent = 'メールアドレスの形式を確認してください。'; return; }
  busy($('resendBtn'), true, '送信中…');
  try { const d = await api('resend', { email }); $('resendMsg').textContent = d.message; }
  catch (_) { $('resendMsg').textContent = '通信に失敗しました。'; }
  finally { busy($('resendBtn'), false, '再送'); }
});

/* ---------- 共通 ---------- */
function finish(title, slot, msg, linkHtml) {
  $('doneTitle').textContent = title;
  $('doneSlot').hidden = false; $('doneSlot').textContent = fmtSlot(slot);
  $('doneMsg').textContent = msg;
  $('doneLink').innerHTML = linkHtml || '';
  show(['done']);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function busy(btn, on, label) { btn.disabled = on; btn.textContent = label; }

(async function init() {
  if (!API || API.includes('XXXX')) { showError('config.js の API_URL が設定されていません。'); return; }
  if (token) { await loadManage(); return; }
  show(['pick', 'resendBox']);
  try {
    const d = await api('slots');
    if (!d.ok) throw new Error();
    applyHeader(d); slots = d.slots; renderList();
  } catch (_) { $('list').innerHTML = '<p class="muted">一覧を取得できませんでした。時間をおいて「更新」を押してください。</p>'; }
})();
</script>
</body>
</html>
